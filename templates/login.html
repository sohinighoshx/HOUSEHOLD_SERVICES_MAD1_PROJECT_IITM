<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · ServiceHub</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #fdf6f0;
            padding: 1.5rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #fffbf8;
            border-radius: 20px;
            padding: 2.2rem 2.2rem 2.5rem 2.2rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #f0e4d8;
        }

        /* ===== BRAND ===== */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: #2d1f14;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand .logo i {
            color: #d4a373;
            font-size: 1.6rem;
        }

        .brand .logo span {
            color: #d4a373;
            font-weight: 300;
        }

        .brand h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d1f14;
            margin-top: 0.4rem;
            letter-spacing: -0.3px;
        }

        .brand p {
            color: #8a7a6a;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        /* ===== FLASH MESSAGES ===== */
        .flash-messages {
            margin-bottom: 1.2rem;
        }

        .flash {
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.85rem;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 0.4rem;
            border-left: 4px solid;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .flash.success {
            border-left-color: #4a7a5a;
            color: #2a5a3a;
        }
        .flash.error {
            border-left-color: #b84a3a;
            color: #7a3a2a;
        }
        .flash.info {
            border-left-color: #6a8a9a;
            color: #2a5a6a;
        }
        .flash.warning {
            border-left-color: #b87a4a;
            color: #6a4a2a;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: #2d1f14;
            margin-bottom: 0.25rem;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .form-group label i {
            color: #d4a373;
            width: 1.2rem;
            margin-right: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            border: 1.5px solid #f0e4d8;
            border-radius: 10px;
            background: #fdf8f4;
            transition: all 0.2s;
            font-family: inherit;
            color: #2d1f14;
        }

        .form-group input:focus {
            border-color: #d4a373;
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.12);
            background: white;
        }

        .form-group input::placeholder {
            color: #b8a89a;
        }

        /* ===== BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: #2d1a0e;
            color: #f5ede6;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: #4a2c1a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45, 26, 14, 0.15);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login i {
            color: #d4a373;
        }

        /* ===== FOOTER LINKS ===== */
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .auth-links a {
            color: #8a7a6a;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .auth-links a i {
            color: #d4a373;
            font-size: 0.8rem;
        }

        .auth-links a:hover {
            color: #2d1f14;
            text-decoration: underline;
        }

        .auth-links .admin-link {
            color: #b8a89a;
            font-size: 0.8rem;
            border-top: 1px solid #f5ede6;
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .auth-links .admin-link:hover {
            color: #d4a373;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .login-card {
                padding: 1.5rem 1.2rem;
            }
            .brand h2 {
                font-size: 1.2rem;
            }
            .brand .logo {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <!-- ===== FLASH MESSAGES ===== -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">
                            <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'error' %}fa-exclamation-circle{% elif category == 'warning' %}fa-exclamation-triangle{% else %}fa-info-circle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- ===== LOGIN CARD ===== -->
        <div class="login-card">

            <!-- Brand -->
            <div class="brand">
                <a href="#" class="logo">
                    <i class="fas fa-briefcase"></i>
                    Service<span>Hub</span>
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to continue booking services</p>
            </div>

            <!-- Form -->
            <form method="POST">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a href="{{ url_for('index') }}">
                    <i class="fas fa-user-plus"></i> Create an account
                </a>
                <a href="{{ url_for('admin') }}" class="admin-link">
                    <i class="fas fa-user-shield"></i> Admin Login
                </a>
            </div>

        </div>
    </div>

</body>
</html>
