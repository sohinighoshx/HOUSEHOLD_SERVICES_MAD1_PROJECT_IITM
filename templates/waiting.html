<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Pending</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            width: min(90%, 450px);
            padding: 40px 32px;
            text-align: center;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fff4d6;
            font-size: 32px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 24px;
        }

        p {
            line-height: 1.6;
            color: #6b7280;
            font-size: 15px;
        }

        .status {
            display: inline-block;
            margin-top: 22px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #fff4d6;
            color: #92400e;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">⏳</div>

        <h1>Approval Pending</h1>

        <p>
            Your account is currently awaiting approval.
            Please wait while an administrator reviews your request.
        </p>

        <span class="status">Waiting for approval</span>
    </div>
</body>
</html>
